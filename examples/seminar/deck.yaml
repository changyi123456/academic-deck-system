# Golden example（作者真實研究改寫）：SSCI 科學教育研究研討會簡報
# 原稿：From Content Knowledge to Informal Reasoning (Chang-Yi Chiang)
schema_version: "1.0"

deck:
  id: ck-mc-ir-mediation-seminar
  title: From Content Knowledge to Informal Reasoning
  subtitle: The Mediating Role of Modeling Competence in Socio-Scientific Issues
  author:
    name: Chang-Yi Chiang
    handle: aiphysicsteacher
    affiliation: AI Physics Classroom
  event: Science Education Conference
  date: 2026-07-12
  language: en
  secondary_language: zh-Hant
  preset: seminar
  theme: board-dark
  aspect_ratio: "16:9"
  outputs: [html, pdf, pptx]
  bibliography: references.yaml
  template_version: "0.1.0"

slides:
  - id: s01
    type: title
    title: From Content Knowledge to Informal Reasoning
    subtitle: The Mediating Role of Modeling Competence in Socio-Scientific Issues
    meta: ["Reporter: Chang-Yi Chiang", "Science Education Conference"]
    notes: |
      30-sec hook: students know the science, yet reason poorly on real
      socio-scientific issues. This study asks what bridges that gap.

  - id: s02
    type: agenda
    title: Outline
    bullets:
      - Introduction — three constructs and one gap
      - Methodology — 443 students, "The Mystery of Methane"
      - Results — the bottleneck and the mediation path
      - Conclusion — implications for instruction
    notes: Results carry the most weight; signal that early.

  - id: s03
    type: content
    section: introduction
    eyebrow: CONSTRUCTS
    title: Three Cognitive Structures
    panels:
      - heading: Content Knowledge
        body: The ontological entities that science uses to reason with.
      - heading: Modeling Competence
        body: Mentally simulating dynamic change and structuring interlocking causal mechanisms.
      - heading: Informal Reasoning
        body: Employing scientific knowledge for judgment and decision-making within complex SSI.
    citation_ids: [ref-nersessian-2002, ref-oh-2011, ref-sadler-zeidler-2005]
    notes: |
      CK per Kolstø 2001 & Sadler 2004; MC per Nersessian 2002, Oh & Oh 2011,
      Halloun 2007; IR patterns (rationalistic / intuitive / emotive) per
      Sadler & Zeidler 2005.

  - id: s04
    type: research-question
    section: introduction
    eyebrow: RESEARCH QUESTIONS
    claim: Does modeling competence mediate knowledge and reasoning?
    bullets:
      - "RQ1: CK, MC, IR performance levels in a global-warming SSI"
      - "RQ2: Does MC significantly mediate the effect of CK on IR?"
    body: "Hypothesis: MC significantly mediates between CK and IR — knowledge processed through MC yields rigorous reasoning."
    notes: RQ1 is descriptive, RQ2 is the mediation test — the core contribution.

  - id: s05
    type: theory-framework
    section: introduction
    eyebrow: HYPOTHESIZED MODEL
    title: Mediation Path Model
    framework:
      nodes:
        - id: ck
          label: CK
          role: independent
        - id: mc
          label: MC
          role: mediator
        - id: ir
          label: IR
          role: dependent
      edges:
        - from: ck
          to: mc
        - from: mc
          to: ir
        - from: ck
          to: ir
          label: direct
          style: dashed
    notes: |
      Direct CK→IR path drawn dashed: prior work suggests knowledge alone
      transfers weakly to SSI reasoning.

  - id: s06
    type: method-design
    section: methodology
    title: Research Design
    design:
      approach: Quantitative survey with path analysis
      participants: 443 tenth-grade students, one high school in central Taiwan
      instruments:
        - "CK: 12 Taiwan CAP items (national baseline)"
        - "MC: inquiry activity Task 1 (3 questions)"
        - "IR: same activity, Task 2 (2 questions)"
      analysis: Descriptives, Pearson correlations, mediation path analysis
    notes: CAP anchors CK to a national baseline; MC and IR share one authentic context.

  - id: s07
    type: comparison
    section: methodology
    eyebrow: INSTRUMENT
    title: '"The Mystery of Methane"'
    body: An online interactive inquiry activity assessing MC and IR in an authentic global-methane context.
    panels:
      - heading: Task 1 · Stock-and-Flow (MC)
        bullets:
          - Classify methane sources and sinks from text
          - Calculate annual net atmospheric flow
          - Predict concentration four years ahead
      - heading: Task 2 · Policy Decision (IR)
        bullets:
          - Sign the Global Methane Pledge? Justify.
          - Propose policies under national constraints
          - Scaffold — eight stakeholder perspectives
    notes: Same context for MC and IR removes topic-familiarity confounds between tasks.

  - id: s08
    type: stats-table
    section: methodology
    eyebrow: CODING
    claim: IR coded by Sadler & Zeidler's reasoning patterns
    table:
      caption: IR scoring rubric
      columns: [Score, Pattern, Criteria in brief]
      rows:
        - ["0", "Vague", "Unintelligible or ambiguous statements"]
        - ["1", "Emotive", "Affective, care-based welfare priority"]
        - ["1", "Intuitive", "Visceral judgments, uncritical authority appeals"]
        - ["2", "Rationalistic", "Structured deduction, cost-benefit analysis"]
      note: "Rubric adapted from Sadler & Zeidler (2005)"
      source: This study
    citation_ids: [ref-sadler-zeidler-2005]
    notes: Emotive and intuitive both score 1 — complete but non-rationalistic reasoning.

  - id: s09
    type: stats-table
    section: results
    eyebrow: RQ1
    claim: "Performance ordered CK > MC > IR"
    table:
      caption: Descriptive statistics (N = 443)
      columns: [" ", CK, MC, IR]
      rows:
        - [Mean, "8.108", "1.914", "1.289"]
        - [SD, "3.113", "1.030", "1.281"]
        - [Skewness, "-0.996", "-0.502", "0.492"]
        - [Max, "12", "3", "4"]
      note: "CK skews high; IR skews low"
      source: This study
    notes: Students hold solid knowledge, yet reasoning scores collapse — sets up the gap.

  - id: s10
    type: data-result
    section: results
    eyebrow: RQ1 — THE BOTTLENECK
    claim: Prediction is the bottleneck of modeling competence
    hero_stat:
      value: "40.4%"
      label: prediction accuracy
      annotation: accuracy halves here
    table:
      caption: Task 1 sub-skill accuracy
      columns: [Sub-skill, Accuracy]
      rows:
        - [Classification, "75.8%"]
        - [Calculation, "78.3%"]
        - [Prediction, "40.4%"]
      highlight: [2]
      source: This study
    body: Students identified stocks and flows, but struggled to transcode static text into causal mechanisms with predictive validity.
    notes: Accuracy halves at prediction — the transcoding step, not arithmetic, fails.

  - id: s11
    type: content
    section: results
    eyebrow: RQ1 — IR PATTERNS
    title: Why Reasoning Falls Short
    bullets:
      - "Overload: 57.2% never completed claim–data–warrant chains"
      - "Half of complete answers ran on intuition or emotion"
      - "Strategic retreat: shortcuts filter out science knowledge"
    notes: |
      Retreat is effort conservation: replacing costly logical analysis with
      emotional judgment. Links to cognitive-load account in discussion.

  - id: s12
    type: stats-table
    section: results
    eyebrow: RQ2
    claim: All constructs correlate — CK–IR link is weakest
    table:
      caption: Pearson correlations
      columns: [Pair, r, p]
      rows:
        - ["CK – MC", ".318", "< .001"]
        - ["CK – IR", ".212", "< .001"]
        - ["MC – IR", ".343", "< .001"]
      highlight: [1]
      source: This study
    notes: Weak direct CK–IR correlation motivates testing an indirect route via MC.

  - id: s13
    type: stats-table
    section: results
    eyebrow: RQ2 — PATH ANALYSIS
    claim: MC mediation is significant — total effect amplified 184%
    table:
      caption: Path analysis for CK, MC, IR
      columns: [Path / Effect, "β", SE, z, p]
      rows:
        - ["Total CK→IR", ".212", "0.045", "4.759", "< .001"]
        - ["Indirect CK→MC→IR", ".097", "0.020", "4.929", "< .001"]
        - ["CK→MC", ".307", "0.045", "6.858", "< .001"]
        - ["CK→IR (direct)", ".115", "0.045", "2.540", ".011"]
        - ["MC→IR", ".318", "0.044", "7.274", "< .001"]
      highlight: [1]
      note: "95% CI excludes zero for all paths"
      source: This study
    notes: |
      Indirect effect .097 on a direct base of .115 — routing knowledge
      through MC amplifies its impact on reasoning by 184%.

  - id: s13b
    type: big-number
    section: results
    eyebrow: THE MEDIATION PAYOFF
    claim: Routing knowledge through modeling multiplies its power
    hero_stat:
      value: "184%"
      label: amplification of CK's effect on reasoning via MC
      annotation: the bridge pays off
    notes: |
      Let the number breathe — one beat of silence, then restate:
      same knowledge, nearly triple the reasoning impact when modeled.

  - id: s14
    type: evidence-chain
    section: discussion
    eyebrow: SYNTHESIS
    cer:
      claim: MC is the cognitive transformer from knowing to reasoning
      evidence:
        - "Indirect CK→MC→IR effect significant (β = .097, p < .001)"
        - "Prediction accuracy collapses to 40.4% — the transcoding step"
        - "57.2% of students defaulted to incomplete or intuitive reasoning"
      reasoning: "MC both links static memory into interrelated evidence and shifts students from describing 'models of' to using 'models for' prediction."
    notes: Signature CER slide — spend time here; this is the paper's argument in one frame.

  - id: s15
    type: summary
    section: conclusion
    title: Conclusion & Implications
    bullets:
      - Robust CK does not transfer to SSI reasoning by itself
      - MC bridges the gap, amplifying CK's effect by 184%
      - Shift instruction from content delivery to cultivating MC
      - Practice turning text into variable-based causal structures
    notes: |
      End on the instructional claim: building systemic concepts before
      reasoning compels students to clarify trade-offs — promoting
      rationalistic patterns when confronting SSI.

  - id: s16
    type: qa-closing
    title: Thank You
    body: This is the end of my presentation.
    footer: aiphysicsteacher.netlify.app
    notes: Appendix ready — instrument screenshots, full rubric, path diagram details.
